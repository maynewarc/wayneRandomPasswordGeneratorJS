<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <link rel="icon" href="password.png" type="png">
    <title>Password Generator</title>
</head>
<body>
    <div id="container">
        <h1>Random Password Generator</h1>
        <label for="passLength">Password Length</label>
        <br>
        <input type="number" id="passLength" min="1">
        <br><br>

        <button id="myGenerator" onclick="clickGenerate()">Create Password</button>

        <br><br>
        <div id="myPassword"></div>

    </div>

    <script src="script.js"></script>
</body>
</html>
